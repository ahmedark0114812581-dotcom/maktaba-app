<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المكتبة - معاينة</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff;
      direction: rtl;
    }
    .phone-frame {
      width: 375px;
      height: 812px;
      margin: 20px auto;
      border: 2px solid #333;
      border-radius: 40px;
      overflow: hidden;
      position: relative;
      background: #fff;
    }
    .status-bar {
      height: 44px;
      background: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      font-size: 14px;
      font-weight: 600;
    }
    .content {
      height: calc(100% - 44px - 80px);
      overflow-y: auto;
    }
    .search-container {
      margin: 16px;
      background: #f5f5f5;
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .search-input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 16px;
      color: #333;
      outline: none;
    }
    .search-input::placeholder { color: #999; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 0 16px;
    }
    .category-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 4px;
    }
    .category-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .category-name {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      text-align: center;
    }
    .section-title {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      margin: 20px 16px 12px;
    }
    .suggested-scroll {
      display: flex;
      gap: 12px;
      padding: 0 16px;
      overflow-x: auto;
    }
    .suggested-card {
      min-width: 160px;
    }
    .suggested-thumb {
      width: 160px;
      height: 90px;
      background: #e0e0e0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .suggested-title {
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin-top: 4px;
    }
    .suggested-cat {
      font-size: 12px;
      color: #666;
      margin-top: 2px;
    }
    .tab-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      background: #fff;
      border-top: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-around;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .tab-icon { font-size: 20px; }
    .tab-label { font-size: 11px; color: #999; }
    .tab-item.active .tab-label { color: #4CAF50; font-weight: 600; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="status-bar">
      <span>9:41</span>
      <span>📶 🔋</span>
    </div>
    <div class="content">
      <div class="search-container">
        <input class="search-input" placeholder="ابحث عن درس..." />
        <span>🔍</span>
      </div>
      <div class="grid">
        <div class="category-card">
          <div class="category-circle" style="background:#4CAF50">🔢</div>
          <div class="category-name">رياضيات</div>
        </div>
        <div class="category-card">
          <div class="category-circle" style="background:#2196F3">⚗️</div>
          <div class="category-name">كيمياء</div>
        </div>
        <div class="category-card">
          <div class="category-circle" style="background:#FF9800">⚡</div>
          <div class="category-name">فيزياء</div>
        </div>
        <div class="category-card">
          <div class="category-circle" style="background:#9C27B0">🧬</div>
          <div class="category-name">أحياء</div>
        </div>
        <div class="category-card">
          <div class="category-circle" style="background:#00BCD4">🌍</div>
          <div class="category-name">جغرافيا</div>
        </div>
        <div class="category-card">
          <div class="category-circle" style="background:#795548">📜</div>
          <div class="category-name">تاريخ</div>
        </div>
        <div class="category-card">
          <div class="category-circle" style="background:#E91E63">🔤</div>
          <div class="category-name">اللغة الإنجليزية</div>
        </div>
        <div class="category-card">
          <div class="category-circle" style="background:#3F51B5">📖</div>
          <div class="category-name">ثقافة دينية</div>
        </div>
      </div>
      <div class="section-title">مقترح لك</div>
      <div class="suggested-scroll">
        <div class="suggested-card">
          <div class="suggested-thumb">▶️</div>
          <div class="suggested-title">شرح المعادلات</div>
          <div class="suggested-cat">رياضيات • 15:30</div>
        </div>
        <div class="suggested-card">
          <div class="suggested-thumb">▶️</div>
          <div class="suggested-title">الجدول الدوري</div>
          <div class="suggested-cat">كيمياء • 12:45</div>
        </div>
        <div class="suggested-card">
          <div class="suggested-thumb">▶️</div>
          <div class="suggested-title">قوانين نيوتن</div>
          <div class="suggested-cat">فيزياء • 18:20</div>
        </div>
      </div>
    </div>
    <div class="tab-bar">
      <div class="tab-item active">
        <span class="tab-icon">🏠</span>
        <span class="tab-label">الرئيسية</span>
      </div>
      <div class="tab-item">
        <span class="tab-icon">📚</span>
        <span class="tab-label">الفصول الدراسية</span>
      </div>
      <div class="tab-item">
        <span class="tab-icon">📝</span>
        <span class="tab-label">الاختبارات</span>
      </div>
      <div class="tab-item">
        <span class="tab-icon">☰</span>
        <span class="tab-label">المزيد</span>
      </div>
    </div>
  </div>
</body>
</html>
