name: إبقاء السيرفر صاحي

# بينبّه سيرفر Render كل 5 دقايق عشان مينامش
# Render المجاني بينام بعد 15 دقيقة خمول — ده بيخليه صاحي دايماً

on:
  schedule:
    # كل 5 دقايق (الحد الأدنى في GitHub Actions)
    - cron: '*/5 * * * *'
  workflow_dispatch: # عشان تقدر تشغّله يدوياً من GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: نبّه السيرفر
        run: |
          URL="https://maktaba-app-4.onrender.com/api/files"
          echo "بينبّه: $URL"
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL" || echo "000")
            echo "محاولة $i → HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "✅ السيرفر صاحي"
              exit 0
            fi
            sleep 20
          done
          echo "⚠️ السيرفر ما ردش — بس ده مش فشل، مجرد تنبيه"
          exit 0
