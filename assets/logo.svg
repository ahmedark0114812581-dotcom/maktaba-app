<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="yGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5D4037"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
  </defs>

  <!-- Y letter with gold outline -->
  <path d="M100 15 L100 50 M100 50 L60 90 M100 50 L140 90 M60 90 C60 130 80 150 100 150 C120 150 140 130 140 90"
        fill="none" stroke="#D9B98A" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M100 15 L100 50 M100 50 L60 90 M100 50 L140 90 M60 90 C60 130 80 150 100 150 C120 150 140 130 140 90"
        fill="none" stroke="url(#yGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Snake body wrapping around bottom of Y -->
  <path d="M55 100 C40 130 45 160 70 170 C95 180 130 175 145 155 C155 140 158 125 150 110"
        fill="none" stroke="url(#snakeGrad)" stroke-width="12" stroke-linecap="round"/>

  <!-- Snake belly -->
  <path d="M60 105 C50 130 55 155 75 165 C100 175 130 170 142 152"
        fill="none" stroke="#E8EAF6" stroke-width="6" stroke-linecap="round"/>

  <!-- Snake spots -->
  <circle cx="70" cy="140" r="4" fill="#4FB3A9"/>
  <circle cx="95" cy="155" r="3.5" fill="#4FB3A9"/>
  <circle cx="120" cy="150" r="4" fill="#4FB3A9"/>
  <circle cx="140" cy="135" r="3" fill="#4FB3A9"/>

  <!-- Snake head on right side -->
  <ellipse cx="152" cy="95" rx="14" ry="12" fill="#5D4037" stroke="#D9B98A" stroke-width="2"/>

  <!-- Snake eye -->
  <circle cx="156" cy="92" r="4" fill="#1a1a1a"/>
  <circle cx="157" cy="90" r="1.5" fill="#fff"/>

  <!-- Snake smile -->
  <path d="M158 98 Q162 102 158 104" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Snake nostril -->
  <circle cx="160" cy="88" r="1" fill="#1a1a1a"/>

  <!-- Snake tail curl on left -->
  <path d="M55 100 C45 95 40 85 45 78 C50 72 58 75 58 82" fill="none" stroke="#1565C0" stroke-width="6" stroke-linecap="round"/>

  <!-- Smoke puff from tail -->
  <circle cx="55" cy="72" r="5" fill="#A98A63" opacity="0.6"/>
  <circle cx="60" cy="68" r="3" fill="#8A6D4B" opacity="0.4"/>

  <!-- Small heart above smoke -->
  <path d="M58 62 C57 60 55 59 54 60 C53 61 54 63 58 66 C62 63 63 61 62 60 C61 59 59 60 58 62Z" fill="#c62828"/>
</svg>